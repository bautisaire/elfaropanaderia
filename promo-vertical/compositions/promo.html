  <script>
    (function () {
      const vars =
        (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const TITLE = vars.titulo || "EL FARO";
      const CTA = vars.cta || "¡Hacé tu pedido ahora!";
      const URL_TXT = vars.url || "ELFAROPANIFICACION.COM";

      // PRNG con semilla: mismo resultado en cada render
      let seed = 20261114;
      const rnd = () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const rr = (a, b) => a + (b - a) * rnd();

      const split = (id, text) => {
        const el = document.getElementById(id);
        el.textContent = "";
        return Array.from(text).map((c) => {
          const s = document.createElement("span");
          s.className = "pr-ch";
          s.textContent = c;
          el.appendChild(s);
          return s;
        });
      };
      const titleCh = split("pr-title", TITLE);
      const ctaCh = split("pr-cta", CTA);
      const urlCh = split("pr-pill-in", URL_TXT);

      const tl = gsap.timeline({ paused: true });
      const D = 10;

      // ---------- fondo ----------
      tl.fromTo("#pr-pattern", { x: 0, y: 0 }, { x: -280, y: -420, duration: D, ease: "none" }, 0);
      tl.fromTo("#pr-rays", { rotation: 0 }, { rotation: 140, duration: D, ease: "none" }, 0);

      // ---------- tarjeta ----------
      tl.fromTo(
        "#pr-card",
        { scale: 0.88, rotation: -6, y: 60 },
        { scale: 1, rotation: 0, y: 0, duration: 0.9, ease: "elastic.out(1, 0.55)" },
        0,
      );
      tl.fromTo("#pr-cardwrap", { y: 0 }, { y: -14, duration: 1.25, ease: "sine.inOut", repeat: 7, yoyo: true }, 0);
      tl.fromTo(
        "#pr-med",
        { scale: 0.78 },
        { scale: 1, duration: 0.8, ease: "elastic.out(1, 0.5)" },
        0,
      );

      // etiqueta
      tl.fromTo(
        "#pr-label",
        { opacity: 0, scaleX: 1.5 },
        { opacity: 1, scaleX: 1, duration: 0.6, ease: "power3.out" },
        0.15,
      );

      // título: letras que caen desordenadas
      titleCh.forEach((ch, i) => {
        tl.fromTo(
          ch,
          { opacity: 0, y: -300, rotation: rr(-70, 70), scale: 0.4 },
          { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.6, ease: "back.out(2.4)" },
          0.25 + i * 0.07,
        );
      });

      // CTA: letras mezcladas que se acomodan
      ctaCh.forEach((ch, i) => {
        tl.fromTo(
          ch,
          { opacity: 0, x: rr(-40, 40), y: rr(30, 90), rotation: rr(-110, 110) },
          { opacity: 1, x: 0, y: 0, rotation: 0, duration: 0.45, ease: "back.out(2)" },
          1.1 + i * 0.035,
        );
      });

      // ---------- flecha ----------
      tl.fromTo(
        "#pr-arrow",
        { scale: 0, rotation: -180 },
        { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2.2)" },
        1.75,
      );
      tl.fromTo(
        "#pr-arrow-in",
        { y: -8 },
        { y: 10, duration: 0.45, ease: "sine.inOut", repeat: 17, yoyo: true },
        1.9,
      );

      // ---------- píldora con la web ----------
      tl.fromTo(
        "#pr-pill-in",
        { clipPath: "inset(0% 100% 0% 0% round 49px)" },
        { clipPath: "inset(0% 0% 0% 0% round 49px)", duration: 0.65, ease: "power3.inOut" },
        2.05,
      );
      urlCh.forEach((ch, i) => {
        tl.fromTo(
          ch,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2.5)" },
          2.2 + i * 0.022,
        );
      });

      // ---------- logo ----------
      tl.fromTo(
        "#pr-logo",
        { y: 520, scale: 0.3, rotation: -200 },
        { y: 0, scale: 1, rotation: 0, duration: 0.85, ease: "back.out(1.5)" },
        2.45,
      );
      tl.fromTo("#pr-logo-in", { y: 0 }, { y: -12, duration: 1.05, ease: "sine.inOut", repeat: 5, yoyo: true }, 3.4);

      // el faro se enciende
      tl.fromTo("#pr-halo", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 3.0);
      tl.fromTo(
        "#pr-halo",
        { scale: 1 },
        { scale: 1.16, duration: 0.8, ease: "sine.inOut", repeat: 7, yoyo: true, immediateRender: false },
        3.5,
      );
      tl.fromTo("#pr-dusk", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 2.9);
      tl.fromTo("#pr-beam", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.0);
      tl.fromTo("#pr-beam", { rotation: -120 }, { rotation: 600, duration: 6.8, ease: "none" }, 3.0);
      tl.fromTo(
        "#pr-logo-ring",
        { scale: 1, opacity: 0.95 },
        { scale: 2.6, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false },
        3.0,
      );

      // destello en la tarjeta cada vez que el haz pasa por arriba
      [4.0, 5.7, 7.4, 9.1].forEach((t, i) => {
        tl.fromTo(
          "#pr-shine",
          { x: 0, rotation: 18 },
          { x: 1500, rotation: 18, duration: 0.75, ease: "power2.inOut", immediateRender: i === 0 },
          t,
        );
      });

      // ---------- carrusel de productos ----------
      const fx = document.getElementById("pr-fx");
      const burstSets = {};
      const burstAt = (t, cx, cy, radius) => {
        const key = cx + "-" + cy;
        if (!burstSets[key]) {
          burstSets[key] = [];
          for (let i = 0; i < 12; i++) {
            const b = document.createElement("div");
            b.className = "pr-burst" + (i % 3 === 0 ? " pr-w" : "");
            b.style.left = cx - 28 + "px";
            b.style.top = cy - 28 + "px";
            fx.appendChild(b);
            burstSets[key].push(b);
          }
        }
        const bursts = burstSets[key];
        bursts.forEach((b, i) => {
          const a = (i / bursts.length) * Math.PI * 2 + rr(-0.2, 0.2);
          const r = radius * rr(0.8, 1.25);
          const s = rr(0.6, 1.3);
          tl.fromTo(
            b,
            { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
            {
              x: Math.cos(a) * r,
              y: Math.sin(a) * r,
              scale: s,
              rotation: 200,
              duration: 0.5,
              ease: "power3.out",
              immediateRender: false,
            },
            t,
          );
          tl.fromTo(
            b,
            { scale: s, opacity: 1 },
            { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false },
            t + 0.5,
          );
        });
      };

      // 7 productos + cierre: cada uno ocupa 1,2 s exactos (el último, 1,6 s)
      const N = 8;
      const STEP = 1.2;
      const SLOT = Array.from({ length: N }, (_, k) => k * STEP);
      const SWAP = 0.15; // instante del cambio dentro del giro
      // zoom lento de cada foto durante su turno
      for (let k = 0; k < N; k++) {
        const start = k === 0 ? 0 : SLOT[k] + SWAP;
        const end = k < N - 1 ? SLOT[k + 1] + SWAP + 0.1 : D;
        tl.fromTo(
          "#pr-photo-" + k,
          { scale: 1, rotation: k % 2 ? 3 : -3 },
          { scale: 1.1, rotation: k % 2 ? -3 : 3, duration: end - start, ease: "none", immediateRender: k === 0 },
          start,
        );
      }
      for (let k = 1; k < N; k++) {
        const t = SLOT[k];
        const from = k - 1;
        const to = k;
        // giro rápido del medallón
        tl.fromTo(
          "#pr-med",
          { rotation: 0 },
          { rotation: 360, duration: 0.42, ease: "power2.inOut", immediateRender: false },
          t,
        );
        tl.fromTo(
          "#pr-med",
          { scale: 1 },
          { scale: 0.8, duration: 0.16, ease: "power2.in", immediateRender: false },
          t,
        );
        tl.fromTo(
          "#pr-med",
          { scale: 0.8 },
          { scale: 1, duration: 0.34, ease: "back.out(2.6)", immediateRender: false },
          t + 0.16,
        );
        // cambio de foto en el medio del giro
        tl.fromTo(
          "#pr-photo-" + from,
          { opacity: 1 },
          { opacity: 0, duration: 0.08, ease: "none", immediateRender: false },
          t + SWAP,
        );
        tl.fromTo(
          "#pr-photo-" + to,
          { opacity: 0 },
          { opacity: 1, duration: 0.08, ease: "none", immediateRender: false },
          t + SWAP,
        );
        // nombre del producto
        tl.fromTo(
          "#pr-chiptxt-" + from,
          { yPercent: 0, opacity: 1 },
          { yPercent: -110, opacity: 0, duration: 0.14, ease: "power2.in", immediateRender: false },
          t + 0.04,
        );
        tl.fromTo(
          "#pr-chiptxt-" + to,
          { yPercent: 110, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.28, ease: "back.out(2.2)", immediateRender: false },
          t + 0.19,
        );
        tl.fromTo(
          "#pr-chip",
          { scale: 1 },
          { scale: 1.12, duration: 0.13, ease: "power2.out", repeat: 1, yoyo: true, immediateRender: false },
          t + 0.19,
        );
        // onda y chispas
        tl.fromTo(
          "#pr-ring",
          { scale: 1, opacity: 0.95 },
          { scale: 1.75, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false },
          t + 0.18,
        );
        tl.fromTo(
          "#pr-rays",
          { scale: 1 },
          { scale: 1.16, duration: 0.2, ease: "power2.out", repeat: 1, yoyo: true, immediateRender: false },
          t + 0.18,
        );
        burstAt(t + 0.18, 540, 440, 330);
      }

      // ---------- remate final ----------
      const T = 8.8;
      tl.fromTo(
        "#pr-title",
        { scale: 1 },
        { scale: 1.05, transformOrigin: "50% 100%", duration: 0.18, ease: "power2.out", repeat: 1, yoyo: true },
        T,
      );
      titleCh.forEach((ch, i) => {
        tl.fromTo(
          ch,
          { y: 0 },
          { y: -14, duration: 0.2, ease: "power2.out", repeat: 1, yoyo: true, immediateRender: false },
          T + 0.05 + i * 0.045,
        );
      });
      tl.fromTo(
        "#pr-pill",
        { scale: 1 },
        { scale: 1.09, duration: 0.2, ease: "power2.out", repeat: 3, yoyo: true },
        T + 0.15,
      );
      tl.fromTo(
        "#pr-logo",
        { scale: 1, rotation: 0 },
        { scale: 1.22, rotation: 360, duration: 0.75, ease: "back.out(1.8)", immediateRender: false },
        T + 0.1,
      );
      tl.fromTo(
        "#pr-logo-ring",
        { scale: 1, opacity: 0.95 },
        { scale: 3, opacity: 0, duration: 1.0, ease: "power2.out", immediateRender: false },
        T + 0.2,
      );
      burstAt(T + 0.2, 540, 1507, 300);

      // ---------- harina y destellos flotando ----------
      for (let i = 0; i < 34; i++) {
        const star = i % 4 === 0;
        const el = document.createElement("div");
        el.className = star ? "pr-star" : "pr-dot";
        const size = star ? rr(26, 54) : rr(7, 20);
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.left = rr(20, 1040) + "px";
        el.style.top = rr(140, 1900) + "px";
        fx.appendChild(el);
        const t0 = rr(0, 1.2);
        tl.fromTo(el, { y: 0 }, { y: -rr(160, 480), duration: D - t0, ease: "none" }, t0);
        tl.fromTo(
          el,
          { x: -rr(10, 40) },
          { x: rr(10, 40), duration: rr(1.1, 2), ease: "sine.inOut", repeat: 8, yoyo: true },
          t0,
        );
        const tw = rr(0.5, 1.1);
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.3, rotation: 0 },
          {
            opacity: star ? 1 : 0.85,
            scale: 1,
            rotation: star ? 90 : 0,
            duration: tw,
            ease: "sine.inOut",
            repeat: Math.ceil((D - t0) / tw) | 1,
            yoyo: true,
          },
          t0,
        );
      }

      window.__timelines["promo"] = tl;
    })();
  </script>
</template>
