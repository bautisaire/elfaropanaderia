<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fff4e6;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- "Cómo pedir en El Faro" · vertical 1080×1920 · 20 s · 120 bpm (1 compás = 2 s) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="pedir" data-composition-id="pedir" data-composition-src="compositions/pedir.html" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="panaderia" data-composition-id="panaderia" data-composition-src="compositions/panaderia.html" data-start="6" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="armado" data-composition-id="armado" data-composition-src="compositions/armado.html" data-start="10" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="entrega" data-composition-id="entrega" data-composition-src="compositions/entrega.html" data-start="14" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="final" data-composition-id="final" data-composition-src="compositions/final.html" data-start="18" data-duration="2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="20" data-track-index="2" data-volume="1"></audio>
      <audio id="sfx" class="clip" src="assets/sfx.wav" data-start="0" data-duration="20" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
